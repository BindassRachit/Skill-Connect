<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SkillConnect - Find Skilled Professionals Instantly</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css" />
<script src="https://cdn.tailwindcss.com"></script>
<script src="script.js"></script>

  </head>
  <body class="bg-white text-gray-800">
    <!-- Navbar -->
    <header class="navbar">
      <div class="container">
        <div class="nav-content">
          <div class="logo">SkillConnect</div>
          <nav class="nav-links">
            <a href="#">Home</a>
            <a href="#about">About</a>
            <a href="#how-it-works">How It Works</a>
            <a href="#categories">Categories</a>
            <a href="#register">Register</a>
          </nav>
          <button id="menu-toggle" class="mobile-menu-icon">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 6h16M4 12h16M4 18h16"></path>
            </svg>
          </button>
        </div>
        <div id="mobile-menu" class="mobile-menu hidden">
          <a href="#">Home</a>
          <a href="#about">About</a>
          <a href="#how-it-works">How It Works</a>
          <a href="#categories">Categories</a>
          <a href="#register">Register</a>
        </div>
      </div>
    </header>

    <main class="pt-20">
      <!-- Register/Login Section -->
      <section id="register" class="register-section">
        <div class="register-form-container">
          <h2 class="register-heading">Join SkillConnect</h2>
          <form class="register-form">
            <div class="form-row">
              <input type="text" placeholder="Full Name" required>
              <input type="text" placeholder="Skill (e.g. Plumber)" required>
            </div>
            <div class="form-row">
              <input type="tel" placeholder="Phone Number" required>
              <input type="text" placeholder="Location" required>
            </div>
            <div class="form-row">
              <input type="date" placeholder="Date of Birth" required>
              <input type="number" placeholder="Experience (in years)" required>
            </div>
            <input type="email" placeholder="Email Address" required>
            <input type="password" placeholder="Password" required>
            <div>
              <label class="block mb-2 font-medium">Upload Certificate or Resume:</label>
              <input type="file" required>
            </div>
            <button class="register-button">Register</button>
          </form>
        </div>
      </section>
    </main>

    <!-- Footer -->
    <footer class="footer">
      <div class="footer-content">
        <p>&copy; 2025 SkillConnect. All rights reserved.</p>
        <div class="footer-links">
          <a href="#">Privacy Policy</a>
          <a href="#">Terms of Use</a>
          <a href="#">Contact Us</a>
        </div>
      </div>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
